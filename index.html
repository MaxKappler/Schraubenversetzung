  <script>
    'use strict';
    (() => {
      const atoms = JSON.parse(document.getElementById('atom-data').textContent);
      const canvas = document.getElementById('model');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      // Model geometry is fixed. Only the viewing direction and zoom can change.
      const ATOM_RADIUS = 0.28; // in units of a
      const LINE_HALF_LENGTH = 3.4; // x = y = 0, parallel to b = a [001]
      const LINE_WIDTH = 3.5; // CSS pixels
      const initial = {azimuth:-0.93, elevation:0.48, zoom:1};
      const state = {...initial};
      const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));
      const pointers = new Map();
      const TAU = 2*Math.PI;
      let width=0, height=0, dpr=1, scale=1, frame=0;
      let sprite=null, spriteSize=0;

      function project(p) {
        const ca=Math.cos(state.azimuth), sa=Math.sin(state.azimuth);
        const ce=Math.cos(state.elevation), se=Math.sin(state.elevation);
        return {
          x:(-sa*p.x+ca*p.y)*scale+width/2,
          y:(se*ca*p.x+se*sa*p.y-ce*p.z)*scale+height/2,
          depth:ce*ca*p.x+ce*sa*p.y+se*p.z
        };
      }
      // Every atom uses the same neutral sphere material.
      function sphereSprite(radius) {
        const size=Math.max(16,Math.ceil(radius*2*dpr));
        if(sprite && spriteSize===size) return sprite;
        spriteSize=size;
        sprite=document.createElement('canvas'); sprite.width=sprite.height=size+4;
        const c=sprite.getContext('2d'), r=size/2, mid=(size+4)/2;
        const g=c.createRadialGradient(mid-r*.33,mid-r*.37,r*.04,mid,mid,r);
        g.addColorStop(0,'#ffffff'); g.addColorStop(.22,'#dfe2e1');
        g.addColorStop(.52,'#a4aaa9'); g.addColorStop(.78,'#777f7f'); g.addColorStop(1,'#424b4c');
        c.fillStyle=g; c.beginPath(); c.arc(mid,mid,r,0,TAU); c.fill();
        return sprite;
      }
      function paint() {
        frame=0;
        if(!width || !height) return;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,width,height);
        scale=Math.max(1,Math.min(width/11.8,height/11.8)*state.zoom);
        const points=atoms.map(project).sort((a,b)=>a.depth-b.depth);
        const r=ATOM_RADIUS*scale, texture=sphereSprite(r);
        const size=2*r*(1+4/spriteSize);
        // Draw the line first; opaque atom spheres cover it where they overlap.
        const p=project({x:0,y:0,z:-LINE_HALF_LENGTH});
        const q=project({x:0,y:0,z:LINE_HALF_LENGTH});
        ctx.strokeStyle='#000000'; ctx.fillStyle='#000000';
        ctx.lineWidth=LINE_WIDTH; ctx.lineCap='round';
        ctx.setLineDash([]);
        if(Math.hypot(q.x-p.x,q.y-p.y)<0.5) {
          ctx.beginPath(); ctx.arc(p.x,p.y,LINE_WIDTH/2,0,TAU); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
        }
        for(const p of points) ctx.drawImage(texture,p.x-size/2,p.y-size/2,size,size);
      }
      function invalidate() { if(!frame) frame=requestAnimationFrame(paint); }
      function rotate(dx,dy) {
        state.azimuth-=dx*.008;
        state.elevation=clamp(state.elevation+dy*.008,-Math.PI/2,Math.PI/2);
        invalidate();
      }
      function reset() { Object.assign(state,initial); invalidate(); }
      function distance() {
        const [a,b]=[...pointers.values()];
        return a&&b?Math.hypot(a.x-b.x,a.y-b.y):null;
      }
      canvas.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse' && e.button!==0) return;
        canvas.focus({preventScroll:true});
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      });
      canvas.addEventListener('pointermove',e=>{
        const old=pointers.get(e.pointerId);
        if(!old) return;
        const before=distance();
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pointers.size===1) rotate(e.clientX-old.x,e.clientY-old.y);
        else {
          const after=distance();
          if(before>0 && after>0) state.zoom=clamp(state.zoom*after/before,.55,2.5);
          invalidate();
        }
      });
      const release=e=>pointers.delete(e.pointerId);
      canvas.addEventListener('pointerup',release);
      canvas.addEventListener('pointercancel',release);
      canvas.addEventListener('lostpointercapture',release);
      window.addEventListener('blur',()=>pointers.clear());
      canvas.addEventListener('wheel',e=>{
        e.preventDefault();
        const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?height:1);
        state.zoom=clamp(state.zoom*Math.exp(-delta*.001),.55,2.5);
        invalidate();
      },{passive:false});
      canvas.addEventListener('keydown',e=>{
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R','Home'].includes(e.key)) e.preventDefault();
        if(e.key==='ArrowLeft') rotate(-12,0);
        else if(e.key==='ArrowRight') rotate(12,0);
        else if(e.key==='ArrowUp') rotate(0,12);
        else if(e.key==='ArrowDown') rotate(0,-12);
        else if(e.key==='+'||e.key==='=') {state.zoom=clamp(state.zoom*1.1,.55,2.5); invalidate();}
        else if(e.key==='-') {state.zoom=clamp(state.zoom/1.1,.55,2.5); invalidate();}
        else if(e.key.toLowerCase()==='r'||e.key==='Home') reset();
      });
      function resize() {
        const box=canvas.getBoundingClientRect();
        width=box.width; height=box.height; dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        invalidate();
      }
      new ResizeObserver(resize).observe(canvas);
      window.addEventListener('resize',resize);
      resize();
    })();
  </script>
